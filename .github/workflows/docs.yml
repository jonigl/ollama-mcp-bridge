name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "docs-overrides/**"
      - "scripts/**"
      - "mkdocs.yml"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "docs-overrides/**"
      - "scripts/**"
      - "mkdocs.yml"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs derives the version from tags, and mkdocstrings imports
          # the package, so the full history has to be here.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # The hero scene is generated but committed, so the script and its output
      # can drift: the build publishes the committed SVG and would never notice.
      # Regenerating here turns that drift into a failing check.
      - name: Check the generated hero scene is current
        run: |
          python3 scripts/build_hero_scene.py
          if ! git diff --exit-code -- docs-overrides/partials/hero-scene.html; then
            echo "::error file=docs-overrides/partials/hero-scene.html::\
          Out of date. Run 'python3 scripts/build_hero_scene.py' and commit the result."
            exit 1
          fi

      # The social plugin draws the preview cards with Cairo. Usually present
      # on the runner image already; installing it keeps the build from
      # depending on that.
      - name: Install Cairo for social cards
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2

      - name: Build the site
        run: uv run --group docs mkdocs build --strict

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
