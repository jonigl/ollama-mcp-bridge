[project]
name = "ollama-mcp-bridge"
dynamic = ["version"]
description = "Bridge API service connecting Ollama with Model Context Protocol (MCP) servers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["mcp", "ollama", "bridge", "proxy", "api", "fastapi", "ai", "tools", "llm", "model-context-protocol", "local-llm", "ollama-api", "ollama-mcp"]
authors = [
  { name = "Jonathan Gastón Löwenstern" },
]
dependencies = [
    "fastapi>=0.119,<0.200",
    "httpx~=0.28.0",
    "loguru~=0.7.3",
    "mcp>=1.30.0,<2.0.0",
    "packaging>=25.0",
    "typer>=0.24,<0.30",
    "uvicorn>=0.38,<0.55",
]

[project.urls]
Documentation = "https://jonigl.github.io/ollama-mcp-bridge/"
Issues = "https://github.com/jonigl/ollama-mcp-bridge/issues"
Source = "https://github.com/jonigl/ollama-mcp-bridge"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = 'vcs'

[tool.hatch.build.hooks.vcs]
version-file = "src/ollama_mcp_bridge/_version.py"

[project.scripts]
ollama-mcp-bridge = "ollama_mcp_bridge.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ollama_mcp_bridge"]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "requests>=2.32.4",
    "black>=24.0.0",
]
docs = [
    "mkdocs-git-revision-date-localized-plugin>=1.2.0",
    "mkdocs-material[imaging]>=9.5.0",
    "mkdocstrings[python]>=0.26.0",
]

[tool.black]
line-length = 120
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hatch
  | \.pytest_cache
  | \.venv
  | \.vscode
  | __pycache__
  | build
  | dist
)/
'''
